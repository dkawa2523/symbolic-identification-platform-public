<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">使い方の全体像</title><desc id="desc">まず比較まで。採用と最終監査は、必要な場合だけ明示的に進めます。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="420" fill="#ffffff"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#172a3a">
<text x="40" y="52" font-size="27" font-weight="700">使い方の全体像</text>
<text x="40" y="88" font-size="16" fill="#526471">まず比較まで。採用と最終監査は、必要な場合だけ明示的に進めます。</text>
<rect x="40.0" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="57.0" y="167" font-size="20" font-weight="700">入力を固定</text>
<text x="57.0" y="204" font-size="16">CSV・単位・領域</text>
<text x="57.0" y="233" font-size="16">既知式・条件・予算</text>
<text x="57.0" y="262" font-size="16">validate → prepare</text>
<path d="M283.5,214 H302.5" stroke="#64748b" fill="none" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="306.5" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="323.5" y="167" font-size="20" font-weight="700">Trainで探索</text>
<text x="323.5" y="204" font-size="16">選んだnative手法</text>
<text x="323.5" y="233" font-size="16">構造・係数を探索</text>
<text x="323.5" y="262" font-size="16">候補と失敗を保存</text>
<path d="M550.0,214 H569.0" stroke="#64748b" fill="none" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="573.0" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="590.0" y="167" font-size="20" font-weight="700">Selectionで比較</text>
<text x="590.0" y="204" font-size="16">共通指標・適格性</text>
<text x="590.0" y="233" font-size="16">表示代表を固定</text>
<text x="590.0" y="262" font-size="16">式・図・表を出力</text>
<path d="M816.5,214 H835.5" stroke="#64748b" fill="none" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="839.5" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="856.5" y="167" font-size="20" font-weight="700">用途判断・Final</text>
<text x="856.5" y="204" font-size="16">必要な場合だけ</text>
<text x="856.5" y="233" font-size="16">許容条件を先に固定</text>
<text x="856.5" y="262" font-size="16">結果を見て再選択しない</text>
<rect x="40" y="329" width="1040" height="54" rx="6" fill="#eef5f3"/>
<text x="58" y="363" font-size="17">比較は採用ではありません。良い予測は、真の機構・因果関係の証明ではありません。</text>
</g></svg>