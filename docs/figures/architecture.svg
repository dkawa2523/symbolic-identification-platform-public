<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">入力から表示までの責務</title><desc id="desc">共通化するのは問題と証拠の意味。探索アルゴリズムは各手法のままです。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="420" fill="#ffffff"/>
<g font-family="Noto Sans CJK JP, sans-serif" fill="#172a3a">
<text x="40" y="52" font-size="27" font-weight="700">入力から表示までの責務</text>
<text x="40" y="88" font-size="16" fill="#526471">共通化するのは問題と証拠の意味。探索アルゴリズムは各手法のままです。</text>
<rect x="40.0" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="57.0" y="167" font-size="20" font-weight="700">共通準備</text>
<text x="57.0" y="204" font-size="16">config / problem</text>
<text x="57.0" y="233" font-size="16">data / coordinates</text>
<text x="57.0" y="262" font-size="16">単位・splitを凍結</text>
<path d="M283.5,214 H302.5" stroke="#64748b" fill="none" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="306.5" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="323.5" y="167" font-size="20" font-weight="700">手法別worker</text>
<text x="323.5" y="204" font-size="16">PySR / ParFam</text>
<text x="323.5" y="233" font-size="16">TorchSISSO / E2E</text>
<text x="323.5" y="262" font-size="16">PhySO</text>
<path d="M550.0,214 H569.0" stroke="#64748b" fill="none" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="573.0" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="590.0" y="167" font-size="20" font-weight="700">共通評価・保存</text>
<text x="590.0" y="204" font-size="16">portable AST</text>
<text x="590.0" y="233" font-size="16">native予測と照合</text>
<text x="590.0" y="262" font-size="16">study / comparison</text>
<path d="M816.5,214 H835.5" stroke="#64748b" fill="none" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="839.5" y="132" width="240.5" height="164" rx="9" fill="#f3f7fa" stroke="#a6bac9"/>
<text x="856.5" y="167" font-size="20" font-weight="700">表示・持出し</text>
<text x="856.5" y="204" font-size="16">保存値だけを描画</text>
<text x="856.5" y="233" font-size="16">式 / PNG / CSV</text>
<text x="856.5" y="262" font-size="16">hash付き結果</text>
<rect x="40" y="329" width="1040" height="54" rx="6" fill="#eef5f3"/>
<text x="58" y="363" font-size="17">Selection / Final や表示結果をnative探索へ戻さない。表示からfit・採点を逆呼出ししない。</text>
</g></svg>