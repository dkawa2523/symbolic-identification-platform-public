[project]
name = "ml-platform-symbolic"
version = "0.90.4"
description = "Portable symbolic regression, common evaluation and function identification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ml-platform-core==0.1.0", "numpy>=1.24", "pandas>=2", "scipy>=1.11", "resvg-py>=0.5,<0.6"]

[project.optional-dependencies]
pysr = ["pysr==2.7.2"]
physo = ["physo==1.1.11"]
torchsisso = ["TorchSisso==0.1.8"]

[project.scripts]
symbolic = "ml_platform_symbolic.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ml_platform_symbolic.equation_evaluation.backends" = ["*.jl"]

"ml_platform_symbolic" = ["report_template.html"]
