task: symbolic_pipeline
data:
  local_path: data/yacht/table.csv
  target_column: resistance
  feature_columns: [buoyancy_position, prismatic_coefficient, length_displacement_ratio, beam_draught_ratio, length_beam_ratio, froude]
  units: {buoyancy_position: "1", prismatic_coefficient: "1", length_displacement_ratio: "1", beam_draught_ratio: "1", length_beam_ratio: "1", froude: "1", resistance: "1"}
split:
  file: data/yacht/split.csv
  group_column: group_id
search:
  engines: [mean, linear, dictionary, pysr, physo, torchsisso, proged, parfam]
  seeds: [42]
  operators: [add, sub, mul, div]
  max_wall_seconds: 300
  max_export_candidates: 20
  allow_partial_engines: true
  engine_options:
    pysr: {niterations: 12, populations: 3, ncycles_per_iteration: 80}
    physo: {epochs: 5, batch_size: 128, max_n_evaluations: 640}
    torchsisso: {n_expansion: 2, n_term: 3, k: 10}
    proged: {template: polynomial, sample_size: 10, depth_limit: 8, max_attempts: 40}
    parfam: {degree: 1, maxiter: 5, repetitions: 1, max_active_parameters: 7}
constraints: {max_nodes: 30}
evaluation: {selection_policy: balanced, absolute_tolerance: 0.000001}
