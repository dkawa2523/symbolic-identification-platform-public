[project]
name = "symbolic-handoff"
version = "0.90.4"
requires-python = ">=3.11"
dependencies = ["ml-platform-symbolic"]

[project.optional-dependencies]
pysr = ["ml-platform-symbolic[pysr]"]
physo = ["ml-platform-symbolic[physo]"]
torchsisso = ["ml-platform-symbolic[torchsisso]"]
clearml = ["clearml==2.1.12"]

[dependency-groups]
quality = ["pytest>=8", "ruff>=0.12", "build>=1.2"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pkgs/symbolic"]

[tool.uv.sources]
ml-platform-symbolic = { workspace = true }
ml-platform-core = { git = "https://github.com/dkawa2523/ml_platform.git", rev = "91aa29a235527b9ecd6fc7f6d17101beb0cfe9a0", subdirectory = "pkgs/core" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pkgs/symbolic/src", "pkgs/spdml_layer/src"]
addopts = "-m 'not native'"
markers = ["native: explicitly enabled real search-library integration checks"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["outputs", "runtime", "pretrained", "build", "results", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
